# Upptime configuration for GoalsMapper
# Docs: https://upptime.js.org/docs/configuration
 
# --- REQUIRED: replace with your throwaway GitHub account + repo name ---
owner: goalsmapper
repo: uptime-status
 
# The sites to monitor
sites:
  - name: GoalsMapper Website
    url: https://goalsmapper.com
 
  - name: GoalsMapper App
    url: https://live.goalsmapper.com
    # live.goalsmapper.com redirects to the login page — Upptime follows
    # redirects automatically and treats a final 200 as "up".
 
# Status page settings
status-website:
  cname: status.goalsmapper.com   # your custom domain
  name: GoalsMapper Status
  introTitle: "**GoalsMapper** Status"
  introMessage: Check the current availability of GoalsMapper services and stay updated on incidents and scheduled maintenance.
  logoUrl: https://static.goalsmapper.com/public/platform/goalsmapper/logo.png
  favicon: https://static.goalsmapper.com/public/platform/goalsmapper/GM-Icon.png
  theme: light          # or dark
  navbar:
    - title: Status
      href: /
    - title: Website History
      href: /history/goals-mapper-website
    - title: App History
      href: /history/goals-mapper-app
    - title: GoalsMapper
      href: https://goalsmapper.com
 
# How often checks run (GitHub Actions cron). Default is every 5 minutes.
# Leave as-is unless you want to change frequency.
